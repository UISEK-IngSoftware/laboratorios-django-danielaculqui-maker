{% extends "base.html" %}

{% block title %}
Eliminar Pokémon
{% endblock title %}

{% block content %}

<div class="detail-box mt-5 text-center">

    <img src="{{ pokemon.picture.url }}"
         class="pokemon-img mb-4"
         style="max-width:300px;">

    <h2>
        ¿Eliminar a {{ pokemon.name }}?
    </h2>

    <p class="text-muted">
        Esta acción no se puede deshacer.
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit"
                class="btn btn-danger">
            Sí, eliminar
        </button>

        <a href="/"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock content %}
