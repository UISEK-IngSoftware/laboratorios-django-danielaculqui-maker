<html>
    <head>
        <title>Pokedex</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div class="bg-primary text-white p-4 text-center">
                <h1>Mi Pokedex</h1>
            </div>
            <p>Has elegido el pokemon: <strong>{{ pokemon | capfirst }}</strong></p>
            <h3> Detalles del Pokemon </h3>
            <ul class="list-group">
                <li class="list-group-item">
                <strong> Nombre: </strong> {{pokemon | capfirst }}
                </li>
                <li class="list-group-item">
                <strong> Tipo: </strong> {{pokemon.type | capfirst }}
                </li>
                <li class="list-group-item">
                <strong> Altura: </strong> {{pokemon.height }} metros
                </li>
                <li class="list-group-item">
                <strong> Peso:</strong> {{pokemon.weight }} kilogramos
                </li>
            </ul>
        </div>
    </body>
</html>
