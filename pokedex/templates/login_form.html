{% extends "base.html" %}
{% block title %}Iniciar Sesión - Pokédex{% endblock title %}
{% block content %}

<div class="row d-flex justify-content-center mt-5">
    <div class="col-md-4">
        <div class="detail-box p-4 text-center">
            
            <h3 class="mb-4">¡Bienvenido Entrenador!</h3>

            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert" style="background-color: #f8d7da; border: 1px solid #f5c2c7; color: #842029;">
                    Usuario o contraseña incorrectos. Intenta de nuevo.
                </div>
                {% endif %}

                <div class="mb-3 text-start">
                    <label for="id_username" class="form-label fw-bold">Usuario</label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="id_password" class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fa-solid fa-right-to-bracket"></i> Ingresar
                    </button>
                    <a href="{% url 'pokedex:index' %}" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-left"></i> Regresar
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock content %}
