{% extends "base.html" %}
{% block title %}Iniciar Sesión - Pokedex{% endblock title %}
{% block content %}
<div class="row d-flex justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm">
            <h3 class="text-center mb-4">Ingresar al Sistema</h3>
            
            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos. Por favor, intenta de nuevo.
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuario:</label>
                    <input type="text" name="username" id="id_username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">Contraseña:</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>

                <br>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                    <a href="{% url 'pokedex:index' %}" class="btn btn-secondary">Regresar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
